<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart School Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
        <div class="logo-text">Smart School</div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <!-- Populated by JS based on role -->
      </nav>
    </aside>

    <!-- Main -->
    <div class="main-content">
      <!-- Top Navbar -->
      <header class="top-navbar">
        <div class="navbar-left">
          <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
          <div class="global-search">
            <i class="fas fa-search"></i>
            <input type="text" class="form-control" id="globalSearch" placeholder="Search students, teachers, ID...">
            <div class="search-results" id="searchResults"></div>
          </div>
        </div>
        <div class="navbar-right">
          <button class="nav-icon-btn" title="Notifications" id="notifBtn">
            <i class="fas fa-bell"></i>
            <span class="badge bg-danger" id="notifBadge">3</span>
          </button>
          <button class="nav-icon-btn" title="Messages">
            <i class="fas fa-envelope"></i>
          </button>
          <div class="dropdown user-dropdown">
            <button class="dropdown-toggle" data-bs-toggle="dropdown">
              <div class="user-avatar" id="userAvatar">A</div>
              <div class="d-none d-md-block text-start">
                <div class="fw-semibold small" id="userName">Admin</div>
                <div class="text-muted" style="font-size:0.7rem" id="userRole">Administrator</div>
              </div>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
              <li><a class="dropdown-item" href="#" data-section="profile"><i class="fas fa-user me-2"></i>Profile</a></li>
              <li><a class="dropdown-item" href="#" data-section="settings"><i class="fas fa-cog me-2"></i>Settings</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
            </ul>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <div class="page-content" id="pageContent">
        <!-- Dynamic sections loaded here -->
      </div>

      <footer class="app-footer">
        © 2026 Smart School Management System. All Rights Reserved.
      </footer>
    </div>
  </div>

  <!-- Generic Modal -->
  <div class="modal fade" id="appModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Modal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
      </div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body text-center p-4">
          <i class="fas fa-exclamation-triangle text-warning fa-3x mb-3"></i>
          <p id="confirmMessage">Are you sure?</p>
          <div class="d-flex gap-2 justify-content-center">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-danger" id="confirmYes">Yes, Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast" role="alert">
      <div class="toast-header">
        <strong class="me-auto" id="toastTitle">Notification</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toastBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
